<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkibaStore - Catálogo General</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0a1c;
      --card-bg: #1a122e;
      --accent: #ff2a85;
      --accent-hover: #ff53a1;
      --purple-glow: #9d4edd;
      --text-main: #f8fafc;
      --text-muted: #a0aec0;
      --price-color: #00f5d4;
      --border-color: #2d1f47;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 50px; }

    header {
      background-color: rgba(26, 18, 46, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo { font-size: 1.6rem; font-weight: 700; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--accent); }

    nav { display: flex; gap: 10px; flex-wrap: wrap; }
    nav a {
      text-decoration: none; padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      color: var(--text-muted); background-color: transparent; transition: all 0.2s ease-in-out;
    }
    nav a:hover { color: var(--text-main); background-color: rgba(255, 42, 133, 0.1); }
    nav a.active { background-color: var(--accent); color: white; box-shadow: 0 0 15px rgba(255, 42, 133, 0.4); }

    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

    .seccion-header { margin: 10px 0 25px 0; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }

    .tarjeta {
      background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 18px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s, box-shadow 0.3s;
    }
    .tarjeta:hover { transform: translateY(-7px); box-shadow: 0 10px 25px rgba(157, 78, 221, 0.3); border-color: var(--accent); }
    .img-container { width: 100%; height: 220px; background-color: #120b24; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .tarjeta img { max-width: 90%; max-height: 90%; object-fit: contain; }
    
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .badge-figura { background-color: rgba(157, 78, 221, 0.2); color: #c77dff; border: 1px solid #9d4edd; }
    .badge-merch { background-color: rgba(0, 245, 212, 0.15); color: #00f5d4; border: 1px solid #00f5d4; }

    .product-anime { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .product-title { font-size: 1.05rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
    .precio { font-size: 1.25rem; font-weight: 700; color: var(--price-color); }

    /* ESTILOS DEL CUADRO FLOTANTE DE WHATSAPP */
    .btn-flotante-whatsapp {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      z-index: 9999;
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn-flotante-whatsapp:hover {
      background-color: #20ba5a;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      🎌 Akiba<span>Store</span>
    </a>
    <nav>
      <a href="index.html" class="active">Inicio (Todos)</a>
    </nav>
  </header>

  <div class="container">

    <div class="seccion-header">
      <h2>Catálogo Principal (Figuras y Merchandise)</h2>
    </div>

    <div class="grid-productos" id="productos-grid">
      <p class="cargando">Cargando productos de la tienda...</p>
    </div>

  </div>

  <!-- BOTÓN DIRECTO AL CHAT DE TELEGRAM DE DIEGO -->
  <a href="https://telegram.me" target="_blank" style="position: fixed; bottom: 25px; right: 25px; background-color: #0088cc; color: white; text-decoration: none; padding: 12px 20px; border-radius: 50px; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4); z-index: 9999; font-family: 'Poppins', sans-serif;">
    ✈️ Hacer Pedido por Telegram
  </a>


  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEVasLbNpqGOBJ93eUXWOK7EqaAJGpGnY",
      authDomain: "tiendaproductos-e0641.firebaseapp.com",
      projectId: "tiendaproductos-e0641",
      storageBucket: "tiendaproductos-e0641.firebasestorage.app",
      messagingSenderId: "514106123298",
      appId: "1:514106123298:web:cbea281f0fe422edb9967b",
      measurementId: "G-338Q917BV9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const contenedor = document.getElementById("productos-grid");

    function cargarTodosLosProductos() {
      db.collection("figuras").onSnapshot((snapshotFiguras) => {
        db.collection("merchandise").onSnapshot((snapshotMerch) => {
          
          let listaCompleta = [];

          snapshotFiguras.forEach((doc) => {
            listaCompleta.push({ id: doc.id, tipoCat: 'figura', ...doc.data() });
          });

          snapshotMerch.forEach((doc) => {
            listaCompleta.push({ id: doc.id, tipoCat: 'merch', ...doc.data() });
          });

          listaCompleta.sort((a, b) => {
            const fechaA = a.creadoEn ? a.creadoEn.toMillis() : 0;
            const fechaB = b.creadoEn ? b.creadoEn.toMillis() : 0;
            return fechaB - fechaA;
          });

          renderizarGrid(listaCompleta);
        });
      });
    }

    function renderizarGrid(productos) {
      contenedor.innerHTML = "";

      if (productos.length === 0) {
        contenedor.innerHTML = `<div class="vacio">No hay productos en la tienda aún.</div>`;
        return;
      }

      productos.forEach((item) => {
        const card = document.createElement("div");
        card.className = "tarjeta";

        const esFigura = item.tipoCat === 'figura';
        const badgeTexto = esFigura ? 'Figura' : 'Merch';
        const badgeClase = esFigura ? 'badge-figura' : 'badge-merch';

        // CORREGIDO: Cierre de etiquetas HTML completo y exacto para evitar el bucle de "Cargando..."
        card.innerHTML = `
          <div>
            <div class="img-container">
              <img src="${item.imagenUrl || ''}" alt="${item.nombre || ''}" onerror="this.src='https://via.placeholder.com/200/1a122e/a0aec0?text=Sin+Imagen'">
            </div>
            <span class="badge ${badgeClase}">${badgeTexto}</span>
            <div class="product-anime">${item.anime || 'Anime'}</div>
            <div class="product-title" title="${item.nombre}">${item.nombre || 'Sin título'}</div>
            <div class="product-desc">${item.descripcion || ''}</div>
          </div>
          <div class="card-footer">
            <span class="precio">S/ ${parseFloat(item.precio || 0).toFixed(2)}</span>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    cargarTodosLosProductos();
  </script>
</body>
</html>
