<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkibaStore - Figuras de Anime</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0a1c;
      --card-bg: #1a122e;
      --accent: #ff2a85;
      --accent-hover: #ff53a1;
      --purple-glow: #9d4edd;
      --text-main: #f8fafc;
      --text-muted: #a0aec0;
      --price-color: #00f5d4;
      --border-color: #2d1f47;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 50px; }

    header {
      background-color: rgba(26, 18, 46, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo { font-size: 1.6rem; font-weight: 700; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--accent); }

    nav { display: flex; gap: 10px; flex-wrap: wrap; }
    nav a {
      text-decoration: none; padding: 8px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem;
      color: var(--text-muted); background-color: transparent; transition: all 0.2s ease-in-out;
    }
    nav a:hover { color: var(--text-main); background-color: rgba(255, 42, 133, 0.1); }
    nav a.active { background-color: var(--accent); color: white; box-shadow: 0 0 15px rgba(255, 42, 133, 0.4); }

    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 40px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .form-card h2 { font-size: 1.4rem; margin-bottom: 20px; text-align: center; color: var(--text-main); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 14px; background-color: #120b24; border: 1px solid var(--border-color);
      border-radius: 8px; color: var(--text-main); font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); }

    .btn-guardar {
      width: 100%; background-color: var(--accent); color: white; border: none; padding: 12px;
      border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background-color 0.2s;
    }
    .btn-guardar:hover { background-color: var(--accent-hover); }

    .seccion-header { margin: 30px 0 20px 0; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); }
    .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }

    .tarjeta {
      background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 18px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.3s, box-shadow 0.3s;
    }
    .tarjeta:hover { transform: translateY(-7px); box-shadow: 0 10px 25px rgba(157, 78, 221, 0.3); border-color: var(--accent); }
    .img-container { width: 100%; height: 220px; background-color: #120b24; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .tarjeta img { max-width: 90%; max-height: 90%; object-fit: contain; }
    .product-anime { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .product-title { font-size: 1.05rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
    .precio { font-size: 1.25rem; font-weight: 700; color: var(--price-color); }
    .cargando, .vacio { grid-column: 1 / -1; text-align: center; padding: 30px; color: var(--text-muted); background: var(--card-bg); border-radius: 8px; border: 1px dashed var(--border-color); }
  </style>
</head>
<body>

  <header>
    <a href="figuras.html" class="logo">
      🎌 Akiba<span>Store</span>
    </a>
    <nav>
      <a href="figuras.html" class="active">Figuras</a>
      <a href="merch.html">Merchandise</a>
    </nav>
  </header>

  <div class="container">

    <!-- FORMULARIO FIGURAS -->
    <div class="form-card">
      <h2>Registrar Nueva Figura</h2>
      <form id="form-figura">
        <div class="form-group">
          <label>Nombre del Personaje / Figura:</label>
          <input type="text" id="nombre" placeholder="Ej. Gojo Satoru 1/7 Scale" required>
        </div>
        <div class="form-group">
          <label>Anime / Serie:</label>
          <input type="text" id="anime" placeholder="Ej. Jujutsu Kaisen" required>
        </div>
        <div class="form-group">
          <label>URL de la Imagen:</label>
          <input type="url" id="imagenUrl" placeholder="https://ejemplo.com/figura.jpg" required>
        </div>
        <div class="form-group">
          <label>Descripción / Fabricante:</label>
          <textarea id="descripcion" rows="3" placeholder="Ej. Fabricante: Good Smile Company, Altura: 22cm..."></textarea>
        </div>
        <div class="form-group">
          <label>Precio (S/):</label>
          <input type="number" step="0.01" id="precio" placeholder="0.00" required>
        </div>
        <button type="submit" class="btn-guardar">Guardar Figura</button>
      </form>
    </div>

    <!-- CATÁLOGO FIGURAS -->
    <div class="seccion-header">
      <h2>Catálogo de Figuras de Anime</h2>
    </div>
    <div class="grid-productos" id="figuras-grid">
      <p class="cargando">Cargando figuras...</p>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEVasLbNpqGOBJ93eUXWOK7EqaAJGpGnY",
      authDomain: "tiendaproductos-e0641.firebaseapp.com",
      projectId: "tiendaproductos-e0641",
      storageBucket: "tiendaproductos-e0641.firebasestorage.app",
      messagingSenderId: "514106123298",
      appId: "1:514106123298:web:cbea281f0fe422edb9967b",
      measurementId: "G-338Q917BV9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Guardar figura en Firestore
    document.getElementById("form-figura").addEventListener("submit", (e) => {
      e.preventDefault();

      const nombre = document.getElementById("nombre").value;
      const anime = document.getElementById("anime").value;
      const imagenUrl = document.getElementById("imagenUrl").value;
      const descripcion = document.getElementById("descripcion").value;
      const precio = parseFloat(document.getElementById("precio").value);

      db.collection("figuras").add({
        nombre: nombre,
        anime: anime,
        imagenUrl: imagenUrl,
        descripcion: descripcion,
        precio: precio,
        creadoEn: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("¡Figura registrada con éxito!");
        document.getElementById("form-figura").reset();
      }).catch((error) => {
        console.error("Error al guardar: ", error);
        alert("Error al guardar el producto.");
      });
    });

    // Cargar catálogo de figuras
    const contenedor = document.getElementById("figuras-grid");
    db.collection("figuras").orderBy("creadoEn", "desc").onSnapshot((snapshot) => {
      contenedor.innerHTML = "";
      if (snapshot.empty) {
        contenedor.innerHTML = `<div class="vacio">No hay figuras registradas aún.</div>`;
        return;
      }
      snapshot.forEach((doc) => {
        const item = doc.data();
        const card = document.createElement("div");
        card.className = "tarjeta";
        card.innerHTML = `
          <div>
            <div class="img-container">
              <img src="${item.imagenUrl}" alt="${item.nombre}" onerror="this.src='https://via.placeholder.com/200/1a122e/a0aec0?text=Sin+Imagen'">
            </div>
            <div class="product-anime">${item.anime || 'Anime'}</div>
            <div class="product-title" title="${item.nombre}">${item.nombre}</div>
            <div class="product-desc">${item.descripcion || ''}</div>
          </div>
          <div class="card-footer">
            <span class="precio">S/ ${parseFloat(item.precio || 0).toFixed(2)}</span>
          </div>
        `;
        contenedor.appendChild(card);
      });
    });
  </script>
</body>
</html>
